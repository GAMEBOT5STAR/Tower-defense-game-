<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攻打台娃 - 塔防游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- 游戏标题 -->
        <header class="game-header">
            <h1>攻打台娃</h1>
            <p class="subtitle">保卫台湾同胞，实现祖国统一</p>
        </header>

        <!-- 游戏主界面 -->
        <div class="main-game">
            <!-- 左侧控制面板 -->
            <div class="control-panel">
                <div class="game-info">
                    <div class="resource-display">
                        <div class="resource-item">
                            <span class="label">金币:</span>
                            <span id="gold" class="value">100</span>
                        </div>
                        <div class="resource-item">
                            <span class="label">生命值:</span>
                            <span id="health" class="value">100</span>
                        </div>
                        <div class="resource-item">
                            <span class="label">关卡:</span>
                            <span id="level" class="value">1</span>
                        </div>
                    </div>
                </div>

                <!-- 防御塔选择 -->
                <div class="tower-selection">
                    <h3>防御装备</h3>
                    <div class="tower-list">
                        <div class="tower-item" data-type="basic" data-cost="20">
                            <div class="tower-icon">岸炮</div>
                            <div class="tower-info">
                                <span class="tower-name">初级岸炮</span>
                                <span class="tower-cost">金币: 20</span>
                            </div>
                        </div>
                        <div class="tower-item" data-type="rocket" data-cost="50">
                            <div class="tower-icon">火箭</div>
                            <div class="tower-info">
                                <span class="tower-name">箱式火箭</span>
                                <span class="tower-cost">金币: 50</span>
                            </div>
                        </div>
                        <div class="tower-item" data-type="missile" data-cost="100">
                            <div class="tower-icon">导弹</div>
                            <div class="tower-info">
                                <span class="tower-name">导弹系统</span>
                                <span class="tower-cost">金币: 100</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 游戏控制按钮 -->
                <div class="game-controls">
                    <button id="start-btn" class="btn btn-primary">开始游戏</button>
                    <button id="pause-btn" class="btn btn-secondary">暂停</button>
                    <button id="restart-btn" class="btn btn-secondary">重新开始</button>
                </div>
            </div>

            <!-- 游戏地图 -->
            <div class="game-map">
                <canvas id="game-canvas" width="800" height="600"></canvas>
                <div id="game-overlay" class="overlay hidden">
                    <div class="overlay-content">
                        <h2 id="overlay-title">游戏开始</h2>
                        <p id="overlay-message">点击开始游戏按钮开始你的征程</p>
                        <button id="close-overlay" class="btn btn-primary">确定</button>
                    </div>
                </div>
            </div>

            <!-- 右侧信息面板 -->
            <div class="info-panel">
                <div class="enemy-info">
                    <h3>敌方单位</h3>
                    <div class="enemy-list">
                        <div class="enemy-item">
                            <div class="enemy-icon">蛙</div>
                            <div class="enemy-details">
                                <span>台娃步兵</span>
                                <span class="enemy-health">生命: 50</span>
                            </div>
                        </div>
                        <div class="enemy-item">
                            <div class="enemy-icon">蛙</div>
                            <div class="enemy-details">
                                <span>台蛙坦克</span>
                                <span class="enemy-health">生命: 100</span>
                            </div>
                        </div>
                        <div class="enemy-item">
                            <div class="enemy-icon">蛙</div>
                            <div class="enemy-details">
                                <span>台蛙BOSS</span>
                                <span class="enemy-health">生命: 300</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mission-info">
                    <h3>任务目标</h3>
                    <div class="mission-content">
                        <p>保护台湾同胞免受台蛙攻击</p>
                        <p>从南到北解放所有城市</p>
                        <p>最终攻克台北市</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 游戏底部信息 -->
        <footer class="game-footer">
            <p>游戏开发方案基于两岸统一背景设计，寓教于乐</p>
        </footer>
    </div>

    <!-- 游戏音效 -->
    <audio id="bg-music" loop>
        <source src="assets/bg-music.mp3" type="audio/mpeg">
    </audio>
    <audio id="tower-sound">
        <source src="assets/tower-shot.mp3" type="audio/mpeg">
    </audio>
    <audio id="enemy-sound">
        <source src="assets/enemy-hit.mp3" type="audio/mpeg">
    </audio>

    <script src="game.js"></script>
</body>
</html>
